# ==============================================================================
# SAI SMART CUSTOMER VAULT — PRODUCTION CONTAINER ORCHESTRATION
# Enterprise: SAI TOURS & TRAVELS (Madurai HO & Trichy Branch)
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL with pgvector Extension
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sai_vault_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-sai_vault_prod}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sai_vault_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sai_network

  # ----------------------------------------------------------------------------
  # 2. Redis Cache & BullMQ Background Queue
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sai_vault_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sai_network

  # ----------------------------------------------------------------------------
  # 3. Backend REST API Service (@sai/api)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sai_vault_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-sai_vault_prod}?schema=public
      DIRECT_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-sai_vault_prod}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET:-sai_vault_jwt_production_master_secret_key_2026}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-sai_travels_super_secure_vault_aes_256_key_32bytes_!}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_NAME: "SAI SMART CUSTOMER VAULT"
    ports:
      - "4000:4000"
    volumes:
      - vault_uploads:/app/uploads
    networks:
      - sai_network

  # ----------------------------------------------------------------------------
  # 4. Next.js 14 Frontend Web Portal (@sai/web)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sai_vault_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    networks:
      - sai_network

  # ----------------------------------------------------------------------------
  # 5. Nginx Production Gateway & Reverse Proxy
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: sai_vault_nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - sai_network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes & Network
# ------------------------------------------------------------------------------
volumes:
  pgdata:
    name: sai_vault_pgdata
  redisdata:
    name: sai_vault_redisdata
  vault_uploads:
    name: sai_vault_uploads

networks:
  sai_network:
    name: sai_vault_network
    driver: bridge
