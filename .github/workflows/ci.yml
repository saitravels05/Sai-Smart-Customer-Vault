name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Build, Lint & Type-Check
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: "changeme_generate_min_32_char_access_secret_key_12345678"
      JWT_REFRESH_SECRET: "changeme_generate_min_32_char_refresh_secret_key_12345678"
      INITIAL_OWNER_PASSWORD: "OwnerSecurePass2026!"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/sai_vault_dev?schema=public"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20+
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @sai/database db:generate

      - name: Type-Check (TypeScript)
        run: pnpm typecheck

      - name: Lint Codebase
        run: pnpm lint

      - name: Run Tests
        run: pnpm test

      - name: Build All Workspaces
        run: pnpm build
